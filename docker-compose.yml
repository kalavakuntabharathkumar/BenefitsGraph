services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: benefits, POSTGRES_PASSWORD: benefits, POSTGRES_DB: benefitsgraph }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U benefits -d benefitsgraph"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["benefits-data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgres://benefits:benefits@db:5432/benefitsgraph
      JWT_SECRET: local-development-secret-change-me
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "node -e "const {Pool}=require('pg');const fs=require('fs');(async()=>{const p=new Pool({connectionString:process.env.DATABASE_URL});await p.query(fs.readFileSync('db/migrations/001_init.sql','utf8'));await p.end()})().catch(e=>{console.error(e);process.exit(1)})" && node -e "require('./dist/src/db/seed.js')" && node dist/src/index.js"
volumes: { benefits-data: {} }
