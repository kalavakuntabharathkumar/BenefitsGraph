name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: benefits, POSTGRES_PASSWORD: benefits, POSTGRES_DB: benefitsgraph_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U benefits -d benefitsgraph_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run migrate
        env: { DATABASE_URL: postgres://benefits:benefits@localhost:5432/benefitsgraph_test }
      - run: npm test
        env: { TEST_DATABASE_URL: postgres://benefits:benefits@localhost:5432/benefitsgraph_test, DATABASE_URL: postgres://benefits:benefits@localhost:5432/benefitsgraph_test, JWT_SECRET: ci-test-secret }
